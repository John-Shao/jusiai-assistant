# JuSi AI Assistant — configuration file.
#
# Lookup order (later overrides earlier):
#   1. built-in defaults
#   2. this file (see --config / default search paths in README)
#   3. JUSIAI_* environment variables
#   4. command-line flags
#
# Lines starting with '#' and blank lines are ignored. Format: key = value

# --- Backend (JuSi Meet device API) ---------------------------------------
# Base URL of the backend. The device API lives under <base_url>/device-api/v1.0.
base_url = https://meet.jusiai.com

# Pre-shared device API key (Authorization: Bearer <device_api_key>).
device_api_key = jusi-device-2025

# Stable per-device identifier. Leave blank (or leave this key commented out)
# to derive one from the SoC eFuse serial (/proc/cpuinfo "Serial") as
# JUSI-<serial>. That value lives in on-die OTP and survives rootfs / storage
# / U-Boot resets. If no SoC serial is available (desktop / x86 dev), falls
# back to a random id persisted under ~/.config/jusiai-assistant/device_id.
# Uncomment and set to override manually (testing, factory-preset SKUs, etc.).
# device_id = JUSI-lab-01

# --- AI agent -------------------------------------------------------------
# provider: doubao | doubao_s2s | qwen
# profile_code is also accepted by the parser and local HTTP /config API; it
# maps to the same backend field from ai-agent-config-v2 profiles[].code.
# provider = doubao

# Optional overrides. Leave blank to use the provider defaults.
# voice         — output voice (see GET /api/v1.0/rooms/ai-agent-config-v2/, profiles[].voices[].value)
# prompt_id     — preferred prompt selector; use prompts[].id from ai-agent-config-v2
# voice =
# prompt_id =

# --- Media ----------------------------------------------------------------
# Capture resolution requested from the camera (the device picks the closest).
camera_width = 640
camera_height = 480
camera_fps = 30

# Microphone capture / playback sample rate (Hz) and channel count.
audio_sample_rate = 48000
audio_channels = 1

# Acoustic echo cancellation (WebRTC APM). The speaker and microphone share the
# one ES8389 codec, so without it the agent hears its own playback and ends up
# talking to itself — keep it on. audio_aec_delay_ms is the speaker->mic
# round-trip delay hint for the canceller; tune on-board if echo leaks through.
audio_aec = true
audio_aec_delay_ms = 90

# Publish the local camera track to the room (the agent still works audio-only).
publish_video = true

# --- Runtime --------------------------------------------------------------
# autostart — begin the AI call immediately on launch, without waiting for a
# /start command via the control API. Useful on a dedicated device that is
# meant to be always-on.
autostart = false

# Local HTTP control + status API — the only way to drive the device.
#   control_port — TCP port. 0 disables the API entirely.
#   control_bind — bind address. Keep 127.0.0.1 when a sibling voice / phone
#                  module on this device is the caller; set to 0.0.0.0 to let
#                  a phone / remote on the LAN connect directly.
control_bind = 127.0.0.1
control_port = 8765
